services:
  postgres:
    container_name: postgres_db_compra
    image: postgres:17.10
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compra_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: dbAdmin@prueba.com
      PGADMIN_DEFAULT_PASSWORD: 123456789
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
  
volumes:
  postgres_data:
  pgadmin_data: